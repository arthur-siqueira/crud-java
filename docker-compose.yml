services:
  postgres:
    image: postgres:15-alpine
    container_name: crud-java-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=crud_java
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: